name: Android

# 两个 job 分开的原因：
# - analyze 要在 PR 阶段就跑（Flutter 代码本机没有 SDK，只能靠 CI 看类型/lint 错误）；
# - apk 只在手动触发或打 tag 时出包，避免每次 PR 都花 5~10 分钟打包。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "mobile_app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile_app

jobs:
  analyze:
    name: Flutter 静态分析与测试
    # 必须固定 ubuntu-latest：本仓库自建 runner（HPC）没有 Android SDK / JDK17，
    # 不能沿用 ci.yml 的 SELF_HOSTED 切换逻辑。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter 版本与 mobile_app/pubspec.lock 的 sdks 约束（>=3.38.4）保持一致。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 生成代码（build_runner）
        run: dart run build_runner build --delete-conflicting-outputs

      # 硬闸：类型错误与 lint error 必须归零才允许合并。
      - name: 静态分析
        run: flutter analyze --no-fatal-infos

      # 打真网的用例已用 @Tags(['integration']) 在 dart_test.yaml 里默认跳过，
      # 剩下的是纯逻辑测试，因此这里必须是硬闸——否则"测试红了"也不挡合并，
      # 回归信号等于没有。
      - name: 运行测试
        run: flutter test

  apk:
    name: 构建 Release APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 生成代码（build_runner）
        run: dart run build_runner build --delete-conflicting-outputs

      # 注意：vars.API_BASE_URL 未配置时 dart-define 会传空串，产物装到手机上连不上
      # 任何后端。与其静默出个废包，不如提前失败并说明怎么配。
      - name: 检查 API_BASE_URL 变量
        env:
          API_BASE_URL_VALUE: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL_VALUE" ]; then
            echo "::error::仓库变量 API_BASE_URL 未配置。请在 Settings → Secrets and variables → Actions → Variables 添加，例如 https://your-domain/api"
            exit 1
          fi

      - name: 构建 Release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: 上传 APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
