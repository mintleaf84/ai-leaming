name: Android

# 两个 job 分开的原因：
# - analyze 要在 PR 阶段就跑（Flutter 代码本机没有 SDK，只能靠 CI 看类型/lint 错误）；
# - apk 只在手动触发或打 tag 时出包，避免每次 PR 都花 5~10 分钟打包。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "mobile_app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile_app

jobs:
  analyze:
    name: Flutter 静态分析与测试
    # 必须固定 ubuntu-latest：本仓库自建 runner（HPC）没有 Android SDK / JDK17，
    # 不能沿用 ci.yml 的 SELF_HOSTED 切换逻辑。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 覆盖率门禁要用 `git merge-base HEAD origin/main` 定位 PR 基线（G1），
          # 默认浅克隆（depth=1）没有共同祖先，会让门禁降级、PR 作用域规则失效。
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter 版本与 mobile_app/pubspec.lock 的 sdks 约束（>=3.38.4）保持一致。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 生成代码（build_runner）
        run: dart run build_runner build --delete-conflicting-outputs

      # 硬闸：类型错误与 lint error 必须归零才允许合并。
      - name: 静态分析
        run: flutter analyze --no-fatal-infos

      # 打真网的用例已用 @Tags(['integration']) 在 dart_test.yaml 里默认跳过，
      # 剩下的是纯逻辑测试，因此这里必须是硬闸——否则"测试红了"也不挡合并，
      # 回归信号等于没有。
      - name: 运行测试
        run: flutter test --coverage

      # 覆盖率硬闸：分母由文件系统枚举 lib/**/*.dart 得到（新增文件即使没进
      # lcov 也会按"非空非注释行数"计入、命中记 0），因此"只加代码不加测试"
      # 不会把全局数字稀释得更好看。分 scope 设底线，单文件只升不降（容忍 2pp
      # 抖动）；底线存在 mobile_app/coverage_baseline.json，只有显式
      # `dart run tool/coverage_gate.dart --update` 才能抬升，下降需 --allow-lower。
      - name: 覆盖率门禁
        run: dart run tool/coverage_gate.dart

      # 失败时也要留 lcov，否则没法区分"真回退"和"统计口径变了"。
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: mobile_app/coverage/lcov.info
          retention-days: 14

  apk:
    name: 构建 Release APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [analyze]
    # 默认只读；只有 tag 构建要写 Release（R3），所以把写权限收在这一层，
    # 不给 analyze job 也不要写在 workflow 顶层。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Release 正文取 tag 的 commit 列表、上一版 tag 用 git describe 定位，
          # 都需要完整历史与 tag（默认 depth=1 两者都拿不到）。
          fetch-depth: 0

      # R1：versionCode 交给 CI 派生。pubspec 的 version 只有主段（1.0.0）是人工维护的
      # 语义版本，+N 不再由人改（改了也容易忘），统一用 run_number。
      # run_number 是仓库级单调递增的：即使回滚时重跑旧 tag，编号也只会更大，
      # 正好满足 Android「versionCode 不能降级」的安装约束（见 docs/deploy.md §10）。
      - name: 派生版本号
        id: version
        run: |
          raw="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | tr -d '\r[:space:]')"
          name="${raw%%+*}"
          if [ -z "$name" ]; then
            echo "::error::mobile_app/pubspec.yaml 里没有可解析的 version 行（期望形如 1.0.0+1）"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$name+${{ github.run_number }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 生成代码（build_runner）
        run: dart run build_runner build --delete-conflicting-outputs

      # 注意：vars.API_BASE_URL 未配置时 dart-define 会传空串，产物没有内置后端地址。
      # 这不是废包：App 内可以填「服务器地址」并持久化，启动时若三级回落
      # （运行时设置 > 编译期 dart-define > 无）全部为空，会进入明确的配置页。
      # 因此这里只告警、不阻断出包；有域名时仍建议预置，省掉用户首次配置。
      - name: 检查 API_BASE_URL 变量
        env:
          API_BASE_URL_VALUE: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL_VALUE" ]; then
            echo "::warning::仓库变量 API_BASE_URL 未配置，本次产物不含内置地址；首次启动需在 App 内填写服务器地址（Settings → Secrets and variables → Actions → Variables 可预置，例如 https://your-domain/api）"
          fi

      # 固定签名：GitHub 的 hosted runner 每次都是新虚拟机，debug keystore 每次不同，
      # 用它签名会导致「新包装不上旧包」（证书不一致）。因此 release 必须用仓库 secrets
      # 里的固定 keystore；缺配置就直接失败，而不是悄悄产出不可升级的包。
      - name: 恢复签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 secrets:$missing（Settings → Secrets and variables → Actions）。release 包必须用固定证书，否则无法覆盖升级。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          # Java Properties 把反斜杠当转义符：密码里若含 \ 必须写成 \\
          esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g'; }
          {
            echo "storeFile=release-key.jks"
            echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > android/key.properties

      # R1 + R4：--build-name 覆盖 versionName（取 pubspec 主段），--build-number 覆盖
      # versionCode（取 run_number），gradle 侧读的正是 flutter.versionCode/versionName，
      # 因此 android/app/build.gradle.kts 无需改动。
      # BUILD_SHA 是构建指纹、APP_VERSION 是给人看的版本串：两者都靠 dart-define 送进 App。
      # 设置页「关于」的展示属于 Dart 侧改动（当前 App 里版本号是硬编码），未在本次改动内；
      # define 先传，是为了让那一步只需要改一行 UI，不必再回头动 workflow。
      - name: 构建 Release APK
        run: >-
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --dart-define=BUILD_SHA=${{ github.sha }}
          --dart-define=APP_VERSION=${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}

      # 发布用文件单独拷一份带版本号的名字：gh release upload 用文件 basename 当 asset 名，
      # 直接传 app-release.apk 会让所有 Release 的资产同名、下载后无法区分。
      # 副本放在 build/ 里（.gitignore 已忽略），避免本地手工执行这几步时在仓库里留文件。
      - name: 整理产物
        id: package
        run: |
          out="build/app/outputs/flutter-apk"
          versioned="$out/app-release-${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}.apk"
          cp "$out/app-release.apk" "$versioned"
          echo "file=build/app/outputs/flutter-apk/$(basename "$versioned")" >> "$GITHUB_OUTPUT"
          ls -lh "$versioned"

      # R2：artifact 名带版本，两次构建在下载页可区分；保留 30 天（默认 90 天太长，
      # 而 Release 上的资产是长期留存的那一份，artifact 只是当次调试用）。
      - name: 上传 APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}
          path: ${{ github.workspace }}/mobile_app/${{ steps.package.outputs.file }}
          retention-days: 30

      # R3：只在打 tag（v*）时建 Release。用 gh 而不是引第三方 action：
      # 仓库已有 gh 使用习惯，ubuntu-latest 自带 gh，少一个需要 pin 的供应链依赖。
      # 幂等：同一 tag 重跑时改成覆盖资产 + 更新正文，而不是因「Release 已存在」报错。
      - name: 创建 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.package.outputs.file }}
        run: |
          # 上一版 tag 用来说明"本次改了什么"；没有上一版（首个 tag）就退化为全部历史。
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="$prev..$TAG"
            echo "对比范围：$range"
          else
            range="$TAG"
            echo "未找到上一个 tag，正文列出全部可达提交"
          fi

          {
            echo "版本：\`${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}\`"
            echo "构建：\`${{ github.sha }}\`"
            if [ -n "$prev" ]; then
              echo "对比：https://github.com/${{ github.repository }}/compare/$prev...$TAG"
            fi
            echo
            echo "## 变更"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "$range"
            echo
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：覆盖资产并更新正文"
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi

