name: autofix.ci

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm ci
      - run: npx prettier --write "**/*.{ts,tsx,js,jsx,json,css,md}"

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
