name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: my-next-app

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ${{ (github.event_name == 'push' && vars.SELF_HOSTED == 'true') && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-next-app/package-lock.json

      - name: 缓存 node_modules
        uses: actions/cache@v4
        with:
          path: my-next-app/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('my-next-app/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: 安装依赖
        run: npm ci

      - name: ESLint 与类型检查（并行）
        run: |
          npm run lint &
          lint_pid=$!
          npx tsc --noEmit &
          tsc_pid=$!
          wait "$lint_pid"
          lint_status=$?
          wait "$tsc_pid"
          tsc_status=$?
          exit $((lint_status || tsc_status))

  unit-test:
    name: 单元测试 (Vitest)
    runs-on: ${{ (github.event_name == 'push' && vars.SELF_HOSTED == 'true') && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-next-app/package-lock.json

      - name: 缓存 node_modules
        uses: actions/cache@v4
        with:
          path: my-next-app/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('my-next-app/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: 检测变更文件
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'my-next-app/src/**'
              - 'my-next-app/tests/**'
              - 'my-next-app/vitest.config.ts'
              - 'my-next-app/package-lock.json'

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试（含覆盖率）
        if: steps.changed.outputs.code == 'true'
        run: npx vitest run --coverage
        env:
          BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-for-testing-only

      - name: 上传覆盖率报告
        if: steps.changed.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Next.js 构建校验
    runs-on: ${{ (github.event_name == 'push' && vars.SELF_HOSTED == 'true') && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [ lint, unit-test ]
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      JWT_SECRET: ci-placeholder-secret
      AI_API_KEY: ci-placeholder-key
      DB_FILENAME: ci-test.db
      BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-for-testing-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-next-app/package-lock.json

      - name: 缓存 node_modules
        uses: actions/cache@v4
        with:
          path: my-next-app/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('my-next-app/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: 安装依赖
        run: npm ci

      - name: 运行数据库迁移
        run: npm run db:migrate

      - name: 构建 Next.js
        run: npm run build
