name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

defaults:
  run:
    working-directory: my-next-app

jobs:
  lint:
    name: Lint & Type Check
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

  unit-test:
    name: 单元测试 (Vitest)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试（含覆盖率）
        run: npx vitest run --coverage

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: my-next-app/coverage/
          retention-days: 7

  build:
    name: Next.js 构建校验
    runs-on: self-hosted
    timeout-minutes: 30
    needs: [ lint, unit-test ]
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      JWT_SECRET: ci-placeholder-secret
      AI_API_KEY: ci-placeholder-key
      DB_FILENAME: ci-test.db
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: npm ci

      - name: 运行数据库迁移
        run: npm run db:migrate

      - name: 构建 Next.js
        run: npm run build
