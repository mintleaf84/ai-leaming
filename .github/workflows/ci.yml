name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: my-next-app

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ${{ (github.event_name == 'push' && vars.SELF_HOSTED == 'true') && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-next-app/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 依赖安全审计（high 及以上直接失败）
        run: npm audit --audit-level=high

      - name: catch 形态审计（logged / fallback / silent 不得增加）
        run: npm run audit:catches

      - name: ESLint（warning 棘轮）与类型检查（并行）
        run: |
          npm run lint:ci &
          lint_pid=$!
          npm run typecheck &
          tsc_pid=$!
          wait "$lint_pid"
          lint_status=$?
          wait "$tsc_pid"
          tsc_status=$?
          exit $((lint_status || tsc_status))

  unit-test:
    name: 单元测试 (Vitest)
    runs-on: ${{ (github.event_name == 'push' && vars.SELF_HOSTED == 'true') && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-next-app/package-lock.json

      - name: 安装依赖
        run: npm ci

      # 注意：这里不做路径过滤。历史上用 paths-filter 跳过纯文档/配置改动，
      # 会让「单元测试 (Vitest)」这个必需检查在不跑测试的情况下报绿，
      # 等于闸门形同虚设（见 docs/engineering.md 第 4 条）。
      - name: 运行单元测试（含覆盖率）
        run: npx vitest run --coverage
        env:
          BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-for-testing-only

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (Playwright · chromium)
    runs-on: ${{ (github.event_name == 'push' && vars.SELF_HOSTED == 'true') && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 40
    needs: [ lint ]
    env:
      JWT_SECRET: ci-placeholder-secret
      AI_API_KEY: ci-placeholder-key
      BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-for-testing-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-next-app/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright 浏览器（chromium）
        run: npx playwright install --with-deps chromium

      # 只跑 8 条关键路径，控制时长；其余 spec 仍可本地全量执行。
      - name: 运行关键路径 E2E
        run: |
          npx playwright test \
            tests/e2e/auth.spec.ts \
            tests/e2e/practice-flow.spec.ts \
            tests/e2e/review-flow.spec.ts \
            tests/e2e/dashboard.spec.ts \
            tests/e2e/wrong-book.spec.ts \
            tests/e2e/history.spec.ts \
            tests/e2e/questions-import.spec.ts \
            tests/e2e/admin.spec.ts \
            --project=chromium

      - name: 上传 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: my-next-app/playwright-report/
          retention-days: 7

  build:
    name: Next.js 构建校验
    runs-on: ${{ (github.event_name == 'push' && vars.SELF_HOSTED == 'true') && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [ lint, unit-test ]
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      JWT_SECRET: ci-placeholder-secret
      AI_API_KEY: ci-placeholder-key
      DB_FILENAME: ci-test.db
      BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-for-testing-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-next-app/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行数据库迁移
        run: npm run db:migrate

      - name: 构建 Next.js
        run: npm run build
