name: Build and Push Docker Image to GHCR

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # 目前在 ubuntu-latest（amd64）上构建；若以后把 SELF_HOSTED 指到 arm64 机器，
    # 需要同时改 platforms（或恢复 QEMU），否则 buildx 会反向模拟 amd64，慢回 40 分钟
    runs-on: ${{ vars.SELF_HOSTED != '' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./my-next-app
          push: true
          # 只出 amd64：部署环境是 x86；arm64 要走 QEMU 模拟，
          # `npm ci` + `next build` 那一步会把整条构建拖到 40 分钟以上。
          platforms: linux/amd64
          tags: ghcr.io/${{ env.REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
