name: UI Guard

# 布局护栏单独成流：它现在会暴露存量移动端溢出问题，
# 放在 CI 里会阻断所有 PR 合并。独立后失败仍然可见（PR 上红叉 + artifact），
# 但不进入 required checks；存量清完后再把它并回 CI 并去掉 continue-on-error。
on:
  pull_request:
    branches: [ "master", "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-guard-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: my-next-app

jobs:
  ui-guard:
    name: UI 布局护栏 (Playwright · layout-guard)
    runs-on: ${{ (github.event_name == 'push' && vars.SELF_HOSTED == 'true') && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 40
    # 首次上线先观察：修完存量溢出问题后改为阻断
    # 存量溢出未清完：失败只报告，不阻断
    continue-on-error: true
    env:
      JWT_SECRET: ci-placeholder-secret
      AI_API_KEY: ci-placeholder-key
      BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-for-testing-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-next-app/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('my-next-app/package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-

      # 同 e2e：apt 源在部分 runner 上 DNS 持续失败，系统依赖当作尽力而为
      - name: 安装 Playwright 系统依赖（apt 不可用时跳过）
        run: |
          if ! npx playwright install-deps chromium; then
            echo "::warning::apt 源不可用，跳过系统依赖安装（依赖 runner 镜像自带的 Chrome 库）"
          fi

      - name: 安装 Playwright 浏览器（chromium）
        run: npx playwright install chromium

      - name: 运行布局护栏（27 条：9 路由 × 3 视口）
        run: npx playwright test --project=layout-guard

      - name: 上传 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui-guard
          path: my-next-app/playwright-report/
          retention-days: 7
