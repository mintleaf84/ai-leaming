<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notion Style Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "notion-bg": "#FFFFFF", 
                        "notion-sidebar": "#F7F7F5",
                        "notion-hover": "#EFEFED",
                        "notion-border": "#E1E1E0",
                        "notion-text": "#37352F",
                        "notion-text-light": "#787774",
                        "notion-blue": "#2383E2", 
                        "notion-red": "#EB5757",
                    },
                    fontFamily: {
                        "serif": ["Newsreader", "Songti SC", "SimSun", "serif"],
                        "sans": ["Noto Sans SC", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Helvetica", "Arial", "sans-serif"],
                    },
                    boxShadow: {
                        "card": "0 1px 2px rgba(0, 0, 0, 0.04)",
                    }
                },
            },
        }
    </script>
<style>::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #D3D1CB; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #B0B0B0; 
        }.material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 300,
            'GRAD' 0,
            'opsz' 20;
            font-size: 20px;
        }.material-symbols-filled {
            font-variation-settings:
            'FILL' 1,
            'wght' 300,
            'GRAD' 0,
            'opsz' 20;
            font-family: 'Material Symbols Outlined';
            font-size: 20px;
        }
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-notion-bg text-notion-text font-sans antialiased">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden pb-12">
<header class="pt-10 pb-6 px-6 max-w-lg mx-auto w-full">
<h1 class="text-[32px] font-serif font-bold leading-tight tracking-tight flex items-center gap-3 text-black">
<span class="text-3xl filter grayscale opacity-90">⚙️</span> 设置
            </h1>
</header>
<main class="flex flex-col gap-8 px-5 w-full max-w-lg mx-auto">
<section>
<h3 class="text-notion-text-light text-xs font-semibold uppercase tracking-wider pl-1 mb-2">个人账户</h3>
<div class="bg-white rounded-lg overflow-hidden border border-notion-border shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
<div class="flex items-center justify-between p-3.5 hover:bg-notion-hover cursor-pointer transition-colors group">
<div class="flex items-center gap-3">
<div class="relative h-10 w-10 rounded-full overflow-hidden border border-notion-border">
<img alt="Profile picture" class="h-full w-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBgNPcB3v-NvXDylMVyfj29QVz7NC1_9wqhxh1Wzte8H6NdOC0Y0dD6_z7LQ_0wswX-ig9DV2Ji-wExMJ0Rm98H9HJ5Wdhwz6fIepctco7FA_Z8tj7TTWcC7UiGZQg2VAPF5uMw31sXnT2SmgQE2yQ-rTnL5o_wUYCL1g9f_h2K2gX6DlzYUQyGZaOKVElOQQfD0M0JSE0FHN22Xy2A9BLEofpvg81RfjqUuIe5cIcOZ_pqeY7-nlXOFYAD1c2-1X-Su2suCpo7qfm_"/>
</div>
<div class="flex flex-col justify-center">
<span class="text-[15px] font-medium leading-tight text-notion-text">修改头像</span>
<span class="text-[13px] text-notion-text-light mt-0.5 font-normal">点击上传新照片</span>
</div>
</div>
<span class="material-symbols-outlined text-notion-text-light/70 text-[18px]">arrow_forward_ios</span>
</div>
<div class="h-px w-full bg-notion-border/60 ml-[52px]"></div>
<div class="flex items-center justify-between p-3.5 hover:bg-notion-hover cursor-pointer transition-colors min-h-[52px]">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-6 h-6 text-notion-text">
<span class="material-symbols-outlined">person</span>
</div>
<span class="text-[15px] font-medium text-notion-text">用户名</span>
</div>
<span class="text-notion-text-light font-sans text-[14px]">NotionUser</span>
</div>
<div class="h-px w-full bg-notion-border/60 ml-[52px]"></div>
<div class="flex items-center justify-between p-3.5 hover:bg-notion-hover cursor-pointer transition-colors min-h-[52px]">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-6 h-6 text-notion-text">
<span class="material-symbols-outlined">mail</span>
</div>
<span class="text-[15px] font-medium text-notion-text">邮箱</span>
</div>
<span class="text-notion-text-light font-sans text-[14px]">user@example.com</span>
</div>
</div>
</section>
<section>
<h3 class="text-notion-text-light text-xs font-semibold uppercase tracking-wider pl-1 mb-2">学习设置</h3>
<div class="bg-white rounded-lg overflow-hidden border border-notion-border shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
<div class="flex items-center justify-between p-3.5 hover:bg-notion-hover cursor-pointer transition-colors min-h-[52px]">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-6 h-6 text-notion-text">
<span class="material-symbols-outlined">flag</span>
</div>
<span class="text-[15px] font-medium text-notion-text">每日学习目标</span>
</div>
<div class="flex items-center gap-2">
<span class="text-notion-text-light text-[14px]">50 题</span>
<span class="material-symbols-outlined text-notion-text-light/70 text-[18px]">arrow_forward_ios</span>
</div>
</div>
<div class="h-px w-full bg-notion-border/60 ml-[52px]"></div>
<div class="flex items-center justify-between p-3.5 hover:bg-notion-hover cursor-default transition-colors min-h-[52px]">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-6 h-6 text-notion-text">
<span class="material-symbols-outlined">dark_mode</span>
</div>
<span class="text-[15px] font-medium text-notion-text">深色模式</span>
</div>
<div class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-gray-200 transition-colors duration-200 ease-in-out">
<span class="pointer-events-none inline-block h-5 w-5 translate-x-0 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</div>
</div>
<div class="h-px w-full bg-notion-border/60 ml-[52px]"></div>
<div class="flex items-center justify-between p-3.5 hover:bg-notion-hover cursor-default transition-colors min-h-[52px]">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-6 h-6 text-notion-text">
<span class="material-symbols-outlined">notifications</span>
</div>
<span class="text-[15px] font-medium text-notion-text">提醒通知</span>
</div>
<div class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-notion-blue transition-colors duration-200 ease-in-out">
<span class="pointer-events-none inline-block h-5 w-5 translate-x-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</div>
</div>
</div>
</section>
<section>
<h3 class="text-notion-text-light text-xs font-semibold uppercase tracking-wider pl-1 mb-2">数据管理</h3>
<div class="bg-white rounded-lg overflow-hidden border border-notion-border shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
<div class="flex items-center justify-between p-3.5 hover:bg-notion-hover cursor-pointer transition-colors min-h-[52px]">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-6 h-6 text-notion-text">
<span class="material-symbols-outlined">cloud_upload</span>
</div>
<span class="text-[15px] font-medium text-notion-text">备份笔记</span>
</div>
<span class="material-symbols-outlined text-notion-text-light/70 text-[18px]">arrow_forward_ios</span>
</div>
<div class="h-px w-full bg-notion-border/60 ml-[52px]"></div>
<div class="flex items-center justify-between p-3.5 hover:bg-notion-hover cursor-pointer transition-colors min-h-[52px]">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-6 h-6 text-notion-text">
<span class="material-symbols-outlined">delete</span>
</div>
<span class="text-[15px] font-medium text-notion-text">清空错题本</span>
</div>
<span class="material-symbols-outlined text-notion-text-light/70 text-[18px]">arrow_forward_ios</span>
</div>
</div>
</section>
<section>
<h3 class="text-notion-text-light text-xs font-semibold uppercase tracking-wider pl-1 mb-2">关于</h3>
<div class="bg-white rounded-lg overflow-hidden border border-notion-border shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
<div class="flex items-center justify-between p-3.5 hover:bg-notion-hover cursor-default transition-colors min-h-[52px]">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-6 h-6 text-notion-text">
<span class="material-symbols-outlined">info</span>
</div>
<span class="text-[15px] font-medium text-notion-text">版本号</span>
</div>
<span class="text-notion-text-light font-sans text-[14px]">v1.2.0</span>
</div>
<div class="h-px w-full bg-notion-border/60 ml-0"></div>
<div class="flex items-center justify-center p-3.5 hover:bg-red-50 cursor-pointer transition-colors min-h-[52px]">
<span class="text-[15px] font-medium text-notion-red">退出登录</span>
</div>
</div>
</section>
<div class="h-6"></div>
</main>
</div>

</body></html>
